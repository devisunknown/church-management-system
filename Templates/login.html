<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Scancoat church Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff; /* surface color */
        }
        .font-headline-md, .font-headline-lg, .font-headline-xl, .font-label-md, .font-mono-sm {
            font-family: 'Geist', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            box-shadow: 0px 4px 20px rgba(19, 78, 74, 0.04);
        }
        .focus-ring:focus {
            outline: none;
            border-color: #003633;
            box-shadow: 0 0 0 4px rgba(0, 54, 51, 0.1);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container": "#e5eeff",
                      "on-primary": "#ffffff",
                      "tertiary": "#4c2600",
                      "on-error": "#ffffff",
                      "inverse-surface": "#27313e",
                      "background": "#f8f9ff",
                      "surface-variant": "#d9e3f4",
                      "secondary-fixed-dim": "#c7c7c2",
                      "on-surface": "#121c28",
                      "surface-container-high": "#dfe9fa",
                      "primary": "#003633",
                      "outline-variant": "#bfc8c6",
                      "primary-fixed": "#b5ede7",
                      "on-tertiary-container": "#ff9c42",
                      "surface-container-low": "#eef4ff",
                      "surface-container-highest": "#d9e3f4",
                      "on-secondary-container": "#646561",
                      "surface-bright": "#f8f9ff",
                      "primary-fixed-dim": "#9ad1cb",
                      "tertiary-fixed-dim": "#ffb77d",
                      "on-secondary": "#ffffff",
                      "on-tertiary-fixed-variant": "#6e3900",
                      "surface-tint": "#316763",
                      "outline": "#707977",
                      "secondary-fixed": "#e3e3de",
                      "on-primary-fixed": "#00201e",
                      "on-background": "#121c28",
                      "tertiary-container": "#6d3800",
                      "error": "#ba1a1a",
                      "secondary-container": "#e3e3de",
                      "on-surface-variant": "#404847",
                      "on-secondary-fixed-variant": "#464744",
                      "on-secondary-fixed": "#1b1c19",
                      "inverse-primary": "#9ad1cb",
                      "tertiary-fixed": "#ffdcc3",
                      "primary-container": "#134e4a",
                      "secondary": "#5e5f5b",
                      "on-primary-container": "#87beb8",
                      "inverse-on-surface": "#eaf1ff",
                      "on-tertiary-fixed": "#2f1500",
                      "on-primary-fixed-variant": "#144f4b",
                      "error-container": "#ffdad6",
                      "on-tertiary": "#ffffff",
                      "surface-dim": "#d1dbec",
                      "surface-container-lowest": "#ffffff",
                      "on-error-container": "#93000a",
                      "surface": "#f8f9ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "container-padding": "32px",
                      "gutter": "24px",
                      "unit": "4px",
                      "sidebar-width": "260px",
                      "card-gap": "20px"
              },
              "fontFamily": {
                      "headline-md": ["Geist"],
                      "body-md": ["Inter"],
                      "headline-xl": ["Geist"],
                      "mono-sm": ["Geist"],
                      "label-md": ["Geist"],
                      "headline-lg": ["Geist"],
                      "headline-lg-mobile": ["Geist"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                      "mono-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                      "headline-lg": ["30px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-container-lowest min-h-screen flex flex-col items-center justify-center p-6 overflow-hidden relative">
<!-- Atmospheric WebGL Background Layer (Subtle Gradient) -->
<div class="absolute inset-0 pointer-events-none opacity-20">

</div>
<!-- Main Container -->
<main class="w-full max-w-md z-10">
<!-- Logo & Branding -->
<div class="flex flex-col items-center mb-10">
<div class="bg-primary text-on-primary w-14 h-14 rounded-xl flex items-center justify-center mb-4 shadow-lg">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">temple_buddhist</span>
</div>
<h1 class="text-primary font-headline-lg text-headline-lg tracking-tight">Scancoat church</h1>
</div>
<!-- Login Card -->
<div class="bg-white rounded-xl p-8 login-card border border-primary/5">
{% if error %}
<div class="mb-6 flex items-center gap-2 rounded-lg border border-error/20 bg-error-container/40 px-4 py-3 text-error font-body-md text-body-md">
<span class="material-symbols-outlined text-xl">error</span>
<span>{{ error }}</span>
</div>
{% endif %}
<header class="mb-8">
<h2 class="text-on-surface font-headline-md text-headline-md">Welcome back</h2>
<p class="text-on-surface-variant font-body-md text-body-md mt-1">Sign in to manage your ministry.</p>
</header>
<form action="{% url 'login' %}" class="space-y-6" method="POST" >
<!-- Username Field -->
 {% csrf_token %}
<input name="next" type="hidden" value="{{ request.GET.next }}"/>
<div class="space-y-2">
<label class="block text-on-surface font-label-md text-label-md" for="username">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">person</span>
<input class="w-full pl-11 pr-4 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md focus-ring transition-all" id="username" name="username" placeholder="admin" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block text-on-surface font-label-md text-label-md" for="password">Password</label>
<a class="text-primary font-label-md text-label-md hover:underline decoration-primary-fixed-dim" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">lock</span>
<input class="w-full pl-11 pr-12 py-3 bg-white border border-outline-variant rounded-lg font-body-md text-body-md focus-ring transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-xl" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary/20 border-outline-variant rounded" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 block text-on-surface-variant font-body-md text-body-md cursor-pointer select-none" for="remember">
                        Remember me for 30 days
                    </label>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary py-3 px-4 rounded-lg font-headline-md text-headline-md hover:bg-primary-container hover:text-on-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-md" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
<!-- Secondary Action (Mobile/Alternative Layout) -->
<div class="mt-8 pt-6 border-t border-surface-variant flex flex-col items-center gap-4">
<p class="text-on-surface-variant font-body-md text-body-md">Don't have an account?</p>
<a class="text-primary font-headline-md text-headline-md px-6 py-2 border border-primary/20 rounded-lg hover:bg-primary/5 transition-colors inline-block" href="{% url 'signup' %}">
                    Request Access
                </a>
</div>
</div>
<!-- Footer -->
<footer class="mt-8 text-center">
<p class="text-on-surface-variant font-label-md text-label-md">
                Need help? <a class="text-primary hover:underline font-bold" href="#">Contact your church administrator.</a>
</p>
<div class="mt-4 flex justify-center gap-6 text-outline font-label-md text-label-md">
<a class="hover:text-on-surface transition-colors" href="#">Terms of Service</a>
<a class="hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
</div>
</footer>
</main>
<!-- Visual Accent Element (Subtle Ministry-themed imagery) -->
<div class="hidden lg:block absolute bottom-12 right-12 opacity-40 mix-blend-multiply pointer-events-none select-none">
<div class="w-48 h-48 rounded-full border-4 border-dashed border-primary/20 animate-[spin_60s_linear_infinite]"></div>
</div>
<div class="hidden lg:block absolute top-12 left-12 opacity-40 mix-blend-multiply pointer-events-none select-none">
<div class="w-32 h-32 bg-primary/5 rounded-full blur-3xl"></div>
</div>
<script>
        // Password toggle logic
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });

        // Subtle form shake on empty submit (visual micro-interaction)
        document.querySelector('form').addEventListener('submit', (e) => {
            const username = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!username || !pass) {
                e.preventDefault();
                const card = document.querySelector('.login-card');
                card.classList.add('animate-shake');
                setTimeout(() => card.classList.remove('animate-shake'), 400);
            }
        });
    </script>
<style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both 2;
        }
    </style>
</body></html>
